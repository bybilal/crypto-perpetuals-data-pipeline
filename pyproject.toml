[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-perpetuals-data-pipeline"
version = "0.1.0"
description = "Binance five-minute market data ingestion and SQLite normalization"
requires-python = ">=3.11"
dependencies = ["rich>=13,<16"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
crypto-pipeline = "crypto_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["crypto_pipeline*"]
